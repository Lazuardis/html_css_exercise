<!DOCTYPE html>
<html>
  <head>
    <title>Book a Table</title>
    <meta name="description" content="Middle Eastern food in the Main District.">
    <meta name="author" content="Lazuardi Al-Muzaki">
  </head>
  <body>
    <div id="header">
      <p><a href="index.html">Little Lemon</a></p>
      <p>Middle Eastern food in the Main District</p>
    </div>

    <div id="nav">
      <ul>
        <li><a href="index.html">Menu</a></li>
        <li><a href="location.html">Location</a></li>
        <li><a href="book.html">Book a Table</a></li>
      </ul>
    </div>

    <div id="main">
      <h1>Book a Table</h1>
      <form action="/book" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <br>
        <label for="party">Party size</label>
        <input type="number" id="party" name="party">
        <br>
        <input type="radio" id="indoor" name="seating" value="indoor">
        <label for="indoor">Indoor</label>
        <input type="radio" id="outdoor" name="seating" value="outdoor">
        <label for="outdoor">Outdoor</label>
        <br>
        <label for="requests">Special requests</label>
        <textarea id="requests" name="requests" rows="3"></textarea>
        <br>
        <input type="submit" value="Book a table">
      </form>
    </div>

    <div id="footer">
      <p>123 Rome Road, Main District, Capital City</p>
      <p>Open daily, 11:00–22:00 · (021) 555 0123</p>
    </div>
  </body>
</html>
